title: hullcaster
name: hullcaster
license: MIT
source-code:
  - https://github.com/gilcu3/hullcaster
issues:
  - https://github.com/durrendal/hullcaster-snap
contact:
  - durrendal@lambdacreate.com
base: core24
version: v0.2.0
summary: Terminal-based podcast manager built in Rust
description: |
  Hullcaster is a terminal-based podcast manager with an ncurses-like interface.
  It allows you to subscribe to podcast feeds, sync feeds to check for new 
  episodes, download episodes locally, and play them with an internal or 
  external media player.
  
  Features:
  - Terminal UI for podcast management
  - Built-in audio player for podcast playback
  - Subscribe to and manage multiple podcast feeds
  - Download episodes for offline listening
  - Automatic syncing for new episodes
  - Import/export OPML files
  - Configurable keybindings
  - SQLite-based local database

grade: stable
confinement: strict

# Layout for ALSA libraries
layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa

apps:
  hullcaster:
    command-chain: ["snap/command-chain/alsa-launch"]
    command: bin/hullcaster
    plugs:
      - network
      - home
      - audio-playback
      - audio-record
      - pulseaudio
      - alsa
    environment:
      XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
      XDG_DATA_HOME: $SNAP_USER_DATA/.local/share
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      ALSA_CARD: sysdefault:CARD=PCH
      ALWAYS_USE_PULSEAUDIO: "1"

parts:
  # ALSA mixin part - must be defined before hullcaster
  alsa-mixin:
    plugin: dump
    source: https://github.com/diddlesnaps/snapcraft-alsa.git
    source-subdir: snapcraft-assets
    build-packages:
      - libasound2-dev
    stage-packages:
      - libasound2
      - libasound2-plugins
      - yad
    stage:
      # Restrict to only audio-related files
      - etc/asound.conf
      - snap/command-chain/alsa-launch
      - usr/bin/yad*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libasound*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdnsfile*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libFLAC*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libjack*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpulse*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libsamplerate*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libspeex*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libsndfile*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvorbis*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libogg*
      - usr/share/alsa

  hullcaster:
    after: [alsa-mixin]
    plugin: rust
    source: https://github.com/gilcu3/hullcaster.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    build-packages:
      - pkg-config
      - libsqlite3-dev
      - libssl-dev
      - libasound2-dev
      - libdbus-1-dev
      - libpulse-dev
    stage-packages:
      - libsqlite3-0
      - libssl3t64
      - libpulse0
      - libsndfile1
      - libdbus-1-3
      - ca-certificates
      - pulseaudio-utils
      - libportaudio2
    stage:
      # Exclude the conflicting ALSA libraries that alsa-mixin provides
      - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libasound*
      - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
    override-build: |
      cargo build --release --locked
      install -D -m755 target/release/hullcaster $SNAPCRAFT_PART_INSTALL/bin/hullcaster
